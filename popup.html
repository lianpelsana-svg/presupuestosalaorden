<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #ffffff; }
    h2 { margin: 0 0 15px 0; color: #333; font-size: 18px; text-align: center; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 600; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
    button:hover { background: #4338ca; }
    .footer { margin-top: 15px; font-size: 11px; color: #999; text-align: center; }
    .status { margin-top: 10px; font-size: 13px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <h2>💰 Budget Filter</h2>
  
  <div class="input-group">
    <label>Set your Budget (Limit)</label>
    <input type="number" id="presupuesto" placeholder="Ej: 500 (value without currency)">
  </div>

  <button id="btn-filtrar">Filter Products</button>
  
  <div id="status" class="status"></div>
  
  <div class="footer">
    Universal version. Works on Amazon, ML, eBay, etc.
  </div>

  <script src="popup.js"></script>
</body>
</html>
